<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拉起App示例</title>
</head>
<body>

    <p><a href="installerproduct://routeapi.lechange.com/product">打开App商品详情</a></p>
    <p><a href="https://partner-test-hz2.imou.com/installerproduct">通过App Link打开</a></p>
	
	
    <button onclick="launchApp()">打开安装工APP</button>

    <script>
        function launchApp() {
            // 1. 平台检测（区分Android/iOS）
            const isAndroid = /Android/i.test(navigator.userAgent);
            const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    
            const userAgent = navigator.userAgent.toLowerCase();
            const isWeChat = userAgent.includes('micromessenger'); // 检测是否在微信环境

            // 2. 配置URL Scheme（App的唤起协议，需与App端约定）
            // Android的URL Scheme（示例：安装工的scheme为"installerproduct"）
            const androidScheme = "installerproduct://routeapi.lechange.com/product"; 
            // iOS的URL Scheme（格式与Android一致，需App端同步配置）
            const iosScheme = "installerproduct://product"; 

            // 3. 配置备选链接（未安装App时跳转的下载页/落地页）
            const fallbackUrl = isiOS 
                ? "https://apps.apple.com/cn/app/id1624640444" // iOS App Store
                : "https://sj.qq.com/appdetail/com.dahuatech.lechangeyi"; // Android应用市场

            // 4. 微信环境特殊处理（微信屏蔽scheme，直接提示跳转浏览器）
            if (isWeChat) {
                alert("请点击右上角「...」，选择在浏览器中打开以唤起App");
                return;
            }

            // 5. 尝试唤起App
            let launchSuccess = false;
            const startTime = Date.now();

            // 监听页面可见性变化（判断是否成功唤起App）
            const handleVisibilityChange = () => {
                if (document.visibilityState === 'hidden') {
                    // 页面隐藏，说明App可能被唤起
                    launchSuccess = true;
                }
            };
            document.addEventListener('visibilitychange', handleVisibilityChange);

            // 执行唤起逻辑
            if (isiOS) {
                // iOS使用iframe唤起（部分浏览器对window.location.href支持不好）
                //const iframe = document.createElement('iframe');
                //iframe.style.display = 'none';
                //iframe.src = iosScheme;
                //document.body.appendChild(iframe);
                // 3秒后移除iframe，避免内存占用
                //setTimeout(() => document.body.removeChild(iframe), 3000);
				window.location.href = iosScheme;
            } else if (isAndroid) {
                // Android直接通过location.href唤起
                window.location.href = androidScheme;
            }

            // 6. 检测唤起结果（3秒后判断是否成功）
            setTimeout(() => {
                document.removeEventListener('visibilitychange', handleVisibilityChange);
                const elapsedTime = Date.now() - startTime;

                // 未成功唤起（页面未隐藏，且时间超过2秒）
                if (!launchSuccess && elapsedTime > 2000) {
                    // 跳转到备选链接
                    window.location.href = fallbackUrl;
                }
            }, 3000);
        }
    </script>
</body>
</html>
