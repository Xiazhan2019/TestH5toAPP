		function launchApp() {
    // 平台检测
    const isAndroid = /Android/i.test(navigator.userAgent);
    const isiOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    
    // 定义不同平台的URL Scheme
    const androidUrl = "installerproduct://routeapi.lechange.com/product";
    const iosUrl = "installerproduct://routeapi.lechange.com/products"; // 假设iOS使用不同的格式
    
    // 应用商店下载链接
    const androidFallback = "https://sj.qq.com/appdetail/com.dahuatech.lechangeyi";
    const iOSFallback = "https://apps.apple.com/cn/app/%E4%B9%90%E6%A9%99%E5%AE%89%E8%A3%85%E5%AE%9D/id1624640444";
    
    // 根据平台选择URL
    const appUrl = isAndroid ? androidUrl : iosUrl;
    const fallbackUrl = isAndroid ? androidFallback : iOSFallback;
    
    // 记录点击时间
    const startTime = Date.now();
    
    // 尝试唤起App
    window.location.href = appUrl;
    
    // iOS需要特殊处理WKWebView的情况
    if (isiOS) {
        // 针对WKWebView的iframe方案
        const iframe = document.createElement('iframe');
        iframe.style.display = 'none';
        iframe.src = appUrl;
        document.body.appendChild(iframe);
        
        setTimeout(() => {
            document.body.removeChild(iframe);
        }, 2000);
    }
    
    // 时间检测逻辑
    setTimeout(() => {
        // 检查页面是否隐藏或时间差过小
        if (Date.now() - startTime < 2500 && !document.hidden) {
            window.location.href = fallbackUrl;
        }
    }, 2000);
}
    </script>
    
    <button onclick="launchApp()">JavaScript方式唤起App</button>
